services:
  - type: web
    name: phelotrans-booking
    runtime: python
    repo: https://github.com/Phelah-phelix/phelotrans-booking-system
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn vehicle_booking.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: RENDER
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DISABLE_COLLECTSTATIC
        value: 0

databases:
  - name: phelotrans-db
    plan: free
    databaseName: phelotrans_db
    user: phelotrans_user
