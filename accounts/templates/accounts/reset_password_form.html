{% extends 'base.html' %}

{% block title %}Set New Password - AutoRent{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-white border-0 text-center pt-4">
                    <div class="mb-3">
                        <i class="fas fa-lock fa-3x text-success"></i>
                    </div>
                    <h3 class="fw-bold">Set New Password</h3>
                    <p class="text-muted">Create a new password for your account</p>
                </div>
                <div class="card-body p-4">
                    <form method="post" id="resetForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock text-primary"></i>
                                </span>
                                <input type="password" class="form-control" id="new_password" 
                                       name="new_password" placeholder="Enter new password" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-check-circle text-primary"></i>
                                </span>
                                <input type="password" class="form-control" id="confirm_password" 
                                       name="confirm_password" placeholder="Confirm new password" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm_password')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <small id="passwordMatch" class="text-muted"></small>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn-gradient">
                                <i class="fas fa-save me-2"></i>Reset Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .btn-gradient {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-gradient:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        color: white;
    }
</style>

<script>
    function togglePassword(fieldId) {
        const password = document.getElementById(fieldId);
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        const button = password.parentElement.querySelector('button');
        const icon = button.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    }
    
    // Password match validation
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const passwordMatch = document.getElementById('passwordMatch');
    
    function validatePassword() {
        if (newPassword.value && confirmPassword.value) {
            if (newPassword.value === confirmPassword.value) {
                passwordMatch.innerHTML = '<i class="fas fa-check-circle text-success"></i> Passwords match';
                passwordMatch.className = 'text-success';
            } else {
                passwordMatch.innerHTML = '<i class="fas fa-times-circle text-danger"></i> Passwords do not match';
                passwordMatch.className = 'text-danger';
            }
        } else {
            passwordMatch.innerHTML = '';
        }
    }
    
    newPassword.addEventListener('input', validatePassword);
    confirmPassword.addEventListener('input', validatePassword);
</script>
{% endblock %}
