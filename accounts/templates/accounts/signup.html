{% extends 'base.html' %}

{% block title %}Sign Up - AutoRent{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-6" data-aos="fade-up">
            <div class="card-modern p-4">
                <div class="text-center mb-4">
                    <div class="bg-gradient text-white rounded-circle d-inline-flex p-3 mb-3" style="background: var(--gradient);">
                        <i class="fas fa-user-plus fa-2x"></i>
                    </div>
                    <h2 class="fw-bold">Join AutoRent</h2>
                    <p class="text-muted">Create your account and start your journey</p>
                </div>
                
                <form method="post" action="{% url 'signup' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Username *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-user text-primary"></i>
                                </span>
                                <input type="text" class="form-control" name="username" placeholder="Username" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Email *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-envelope text-primary"></i>
                                </span>
                                <input type="email" class="form-control" name="email" placeholder="Email" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="fas fa-phone text-primary"></i>
                            </span>
                            <input type="tel" class="form-control" name="phone" placeholder="+1 234 567 8900">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="fas fa-map-marker-alt text-primary"></i>
                            </span>
                            <textarea class="form-control" name="address" rows="2" placeholder="Your address"></textarea>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-lock text-primary"></i>
                                </span>
                                <input type="password" class="form-control" id="password1" name="password1" placeholder="Password" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password1')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Confirm Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="fas fa-check-circle text-primary"></i>
                                </span>
                                <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password2')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <small id="passwordMatch" class="text-muted"></small>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="#" class="text-primary">Terms of Service</a> and 
                            <a href="#" class="text-primary">Privacy Policy</a>
                        </label>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn-gradient">
                            <i class="fas fa-user-plus me-2"></i>Create Account
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted mb-2">Already have an account?</p>
                    <a href="{% url 'login' %}" class="btn-outline-gradient">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card-modern {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    
    .form-control:focus {
        box-shadow: none;
        border-color: var(--primary);
    }
    
    .input-group-text {
        background-color: #f8f9fa;
    }
    
    .btn-outline-gradient {
        background: transparent;
        border: 2px solid #667eea;
        color: #667eea;
        padding: 10px 25px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }
    
    .btn-outline-gradient:hover {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-color: transparent;
        color: white;
        transform: translateY(-2px);
    }
</style>

<script>
    function togglePassword(fieldId) {
        const password = document.getElementById(fieldId);
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        const button = password.parentElement.querySelector('button');
        const icon = button.querySelector('i');
        icon.classList.toggle('fa-eye');
        icon.classList.toggle('fa-eye-slash');
    }
    
    // Password match validation
    const password1 = document.getElementById('password1');
    const password2 = document.getElementById('password2');
    const passwordMatch = document.getElementById('passwordMatch');
    
    function validatePassword() {
        if (password1.value && password2.value) {
            if (password1.value === password2.value) {
                passwordMatch.innerHTML = '<i class="fas fa-check-circle text-success"></i> Passwords match';
                passwordMatch.className = 'text-success';
            } else {
                passwordMatch.innerHTML = '<i class="fas fa-times-circle text-danger"></i> Passwords do not match';
                passwordMatch.className = 'text-danger';
            }
        } else {
            passwordMatch.innerHTML = '';
        }
    }
    
    password1.addEventListener('input', validatePassword);
    password2.addEventListener('input', validatePassword);
</script>
{% endblock %}
