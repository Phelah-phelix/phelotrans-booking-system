{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3>Approve Password Reset</h3>
                </div>
                <div class="card-body">
                    <p><strong>User:</strong> {{ user.email }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>New Password</label>
                            <input type="password" name="new_password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success">Approve & Reset Password</button>
                        <a href="{% url 'pending_password_resets' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
